<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Dosely AI app icon — upright mint droplet with a checkmark, on deep ink.
       Master vector; export to PNG sizes for the launcher / splash / favicon. -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#111E33"/>
      <stop offset="0.5" stop-color="#0C1A2B"/>
      <stop offset="1" stop-color="#0A1626"/>
    </linearGradient>
    <linearGradient id="drop" x1="0.3" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#5FF2C8"/>
      <stop offset="1" stop-color="#2ED6A6"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" fill="url(#bg)"/>

  <path d="M50 22 C 59 38, 72 48, 72 60 A 22 22 0 1 1 28 60 C 28 48, 41 38, 50 22 Z" fill="url(#drop)"/>
  <path d="M39 60 L47 67 L63 50" fill="none" stroke="#0A1626" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
